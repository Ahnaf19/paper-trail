services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  # so the CLI can run from the host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this, so a cold first `up` does not race initdb (NFR-1).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy   # a cold first `up` must not race initdb
    env_file: .env
    environment:
      # Inside the compose network the database is `db`, not localhost. The DATABASE_URL in
      # .env is for running the CLI from your host; this overrides it for the container.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # /health queries the database, so "healthy" means "can actually serve".
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
