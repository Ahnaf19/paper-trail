<svg xmlns="http://www.w3.org/2000/svg" width="860" height="486" viewBox="0 0 860 486" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="16.0" y="16.0" width="828.0" height="156" rx="9" fill="#21262d"/><text x="32" y="36" fill="#4493f8" font-size="10" font-weight="700" text-anchor="start">WRITE PATH</text><text x="108" y="36" fill="#656c76" font-size="10" font-weight="400" text-anchor="start">paper ingest — the only thing that talks to arXiv</text><rect x="32" y="56" width="128" height="66" rx="7" fill="none" stroke="#545d68" stroke-width="1.5" stroke-dasharray="4 3"/><text x="96" y="78" fill="#9198a1" font-size="11" font-weight="600" text-anchor="middle">arXiv Atom API</text><text x="96" y="94" fill="#656c76" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1 request / 3 s</text><text x="96" y="108" fill="#656c76" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">backoff on 429</text><path d="M162 82 H182" stroke="#3d444d" stroke-width="1.5" fill="none"/><path d="M182 78 L182 86 L188 82 Z" fill="#3d444d"/><rect x="190" y="56" width="108" height="52" rx="7" fill="none" stroke="#4493f8" stroke-width="1.5"/><text x="244.0" y="78" fill="#4493f8" font-size="12" font-weight="600" text-anchor="middle">fetch</text><text x="244.0" y="94" fill="#656c76" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ArxivClient</text><rect x="312" y="56" width="108" height="52" rx="7" fill="none" stroke="#4493f8" stroke-width="1.5"/><text x="366.0" y="78" fill="#4493f8" font-size="12" font-weight="600" text-anchor="middle">parse</text><text x="366.0" y="94" fill="#656c76" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">parse_feed</text><rect x="434" y="56" width="108" height="52" rx="7" fill="none" stroke="#4493f8" stroke-width="1.5"/><text x="488.0" y="78" fill="#4493f8" font-size="12" font-weight="600" text-anchor="middle">upsert</text><text x="488.0" y="94" fill="#656c76" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">upsert_papers</text><rect x="556" y="56" width="108" height="52" rx="7" fill="none" stroke="#4493f8" stroke-width="1.5"/><text x="610.0" y="78" fill="#4493f8" font-size="12" font-weight="600" text-anchor="middle">embed</text><text x="610.0" y="94" fill="#656c76" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">refresh_embeddings</text><path d="M299 82 H305" stroke="#3d444d" stroke-width="1.5" fill="none"/><path d="M305 78 L305 86 L311 82 Z" fill="#3d444d"/><path d="M421 82 H427" stroke="#3d444d" stroke-width="1.5" fill="none"/><path d="M427 78 L427 86 L433 82 Z" fill="#3d444d"/><path d="M543 82 H549" stroke="#3d444d" stroke-width="1.5" fill="none"/><path d="M549 78 L549 86 L555 82 Z" fill="#3d444d"/><path d="M434 118 V132 H664 V118" stroke="#3fb950" stroke-width="1.5" fill="none"/><text x="549" y="150" fill="#3fb950" font-size="10" font-weight="600" text-anchor="middle">one transaction per page — a paper cannot commit without its vector</text><path d="M665 82 H700" stroke="#3d444d" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/><path d="M700 78 L700 86 L706 82 Z" fill="#3d444d"/><rect x="708" y="56" width="124" height="52" rx="7" fill="none" stroke="#9198a1" stroke-width="1.5"/><text x="770.0" y="78" fill="#9198a1" font-size="12" font-weight="600" text-anchor="middle">watermark</text><text x="770.0" y="94" fill="#656c76" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">_advance_watermark</text><text x="770" y="150" fill="#656c76" font-size="9" font-weight="400" text-anchor="middle">after the loop, only if it</text><text x="770" y="162" fill="#656c76" font-size="9" font-weight="400" text-anchor="middle">reached the previous mark</text><path d="M430 172 V193" stroke="#3d444d" stroke-width="1.5" fill="none"/><path d="M426 193 L434 193 L430 200 Z" fill="#3d444d"/><rect x="272" y="200" width="316" height="56" rx="7" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/><text x="430" y="222" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">PostgreSQL + pgvector</text><text x="430" y="240" fill="#9198a1" font-size="10" font-weight="400" text-anchor="middle">papers · authors · categories · 384-dim vectors</text><path d="M430 256 V276 M228 276 H632 M228 276 V299 M632 276 V299" stroke="#3d444d" stroke-width="1.5" fill="none"/><path d="M224 299 L232 299 L228 306 Z" fill="#3d444d"/><path d="M628 299 L636 299 L632 306 Z" fill="#3d444d"/><rect x="16.0" y="306.0" width="412.0" height="144" rx="9" fill="#21262d"/><text x="32" y="326" fill="#3fb950" font-size="10" font-weight="700" text-anchor="start">READ</text><text x="70" y="326" fill="#656c76" font-size="10" font-weight="400" text-anchor="start">aggregates</text><rect x="32" y="336" width="380" height="52" rx="7" fill="none" stroke="#3fb950" stroke-width="1.5"/><text x="222" y="358" fill="#3fb950" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GET /stats/*</text><text x="222" y="375" fill="#9198a1" font-size="10" font-weight="400" text-anchor="middle">three GROUP BY queries, computed by Postgres</text><text x="222" y="410" fill="#656c76" font-size="10" font-weight="400" text-anchor="middle">no network at all — answers with arXiv unreachable</text><rect x="432.0" y="306.0" width="412.0" height="144" rx="9" fill="#21262d"/><text x="448" y="326" fill="#d29922" font-size="10" font-weight="700" text-anchor="start">READ</text><text x="486" y="326" fill="#656c76" font-size="10" font-weight="400" text-anchor="start">answers</text><rect x="448" y="336" width="380" height="52" rx="7" fill="none" stroke="#d29922" stroke-width="1.5"/><text x="638" y="358" fill="#d29922" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">POST /ask</text><text x="638" y="375" fill="#9198a1" font-size="10" font-weight="400" text-anchor="middle">embed ▸ top-k ▸ gate ▸ generate</text><path d="M638 388 V395" stroke="#3d444d" stroke-width="1.5" fill="none"/><path d="M634 395 L642 395 L638 402 Z" fill="#3d444d"/><rect x="520" y="402" width="236" height="34" rx="7" fill="none" stroke="#545d68" stroke-width="1.5" stroke-dasharray="4 3"/><text x="638" y="423" fill="#9198a1" font-size="10" font-weight="600" text-anchor="middle">OpenAI-compatible LLM</text><text x="430" y="472" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="middle">The read paths never contact arXiv. The write path never talks to the LLM.</text></svg>