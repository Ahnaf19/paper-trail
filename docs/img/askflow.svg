<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>@media (prefers-color-scheme: dark){.f1{fill:#4493f8}.f2{fill:#3fb950}.f3{fill:#f0f6fc}.f4{fill:#9198a1}.f7{fill:#d29922}.f9{fill:#3d444d}.f12{fill:#21262d}.s1{stroke:#4493f8}.s2{stroke:#3fb950}.s4{stroke:#9198a1}.s7{stroke:#d29922}.s9{stroke:#3d444d}}</style><rect x="140" y="16" width="280" height="36" rx="7" fill="#eaeef2" stroke="#59636e" stroke-width="1.5" class="f12 s4"/><text x="280.0" y="38.0" fill="#59636e" font-size="12" font-weight="600" text-anchor="middle" class="f4">question</text><path d="M280 52 V65" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M276 65 L284 65 L280 72 Z" fill="#d1d9e0" class="f9"/><rect x="140" y="72" width="280" height="52" rx="7" fill="none" stroke="#0969da" stroke-width="1.5" class="s1"/><text x="280.0" y="93" fill="#0969da" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f1">embed_query</text><text x="280.0" y="110" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">bge-small · pushed to a thread, CPU-bound</text><path d="M280 124 V137" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M276 137 L284 137 L280 144 Z" fill="#d1d9e0" class="f9"/><rect x="140" y="144" width="280" height="52" rx="7" fill="none" stroke="#0969da" stroke-width="1.5" class="s1"/><text x="280.0" y="165" fill="#0969da" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f1">retrieve top-k</text><text x="280.0" y="182" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">one SQL join — a source cannot fail to resolve</text><path d="M280 196 V209" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M276 209 L284 209 L280 216 Z" fill="#d1d9e0" class="f9"/><rect x="140" y="216" width="280" height="52" rx="7" fill="none" stroke="#bf8700" stroke-width="1.5" class="s7"/><text x="280.0" y="237" fill="#bf8700" font-size="12" font-weight="600" text-anchor="middle" class="f7">GATE 1  ·  score ≥ t</text><text x="280.0" y="254" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">deterministic · runs before the model</text><path d="M420 242 H513" stroke="#bf8700" stroke-width="1.5" fill="none" stroke-dasharray="4 3" class="s7"/><path d="M513 238 L513 246 L520 242 Z" fill="#bf8700" class="f7"/><text x="470" y="234" fill="#bf8700" font-size="9" font-weight="600" text-anchor="middle" class="f7">below t</text><rect x="520" y="216" width="330" height="52" rx="7" fill="none" stroke="#bf8700" stroke-width="1.5" stroke-dasharray="4 3" class="s7"/><text x="685.0" y="237" fill="#bf8700" font-size="12" font-weight="600" text-anchor="middle" class="f7">refuse · zero tokens</text><text x="685.0" y="254" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">the LLM is never called · sources: []</text><path d="M280 268 V281" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M276 281 L284 281 L280 288 Z" fill="#d1d9e0" class="f9"/><rect x="140" y="288" width="280" height="52" rx="7" fill="none" stroke="#0969da" stroke-width="1.5" class="s1"/><text x="280.0" y="309" fill="#0969da" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f1">fit_context</text><text x="280.0" y="326" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">only the papers that fit the budget are cited</text><path d="M280 340 V353" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M276 353 L284 353 L280 360 Z" fill="#d1d9e0" class="f9"/><rect x="140" y="360" width="280" height="52" rx="7" fill="none" stroke="#bf8700" stroke-width="1.5" class="s7"/><text x="280.0" y="381" fill="#bf8700" font-size="12" font-weight="600" text-anchor="middle" class="f7">GATE 2  ·  the grounded prompt</text><text x="280.0" y="398" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">probabilistic · one LLM call</text><path d="M420 386 H513" stroke="#bf8700" stroke-width="1.5" fill="none" stroke-dasharray="4 3" class="s7"/><path d="M513 382 L513 390 L520 386 Z" fill="#bf8700" class="f7"/><text x="470" y="378" fill="#bf8700" font-size="9" font-weight="600" text-anchor="middle" class="f7">not in them</text><rect x="520" y="360" width="330" height="52" rx="7" fill="none" stroke="#bf8700" stroke-width="1.5" stroke-dasharray="4 3" class="s7"/><text x="685.0" y="381" fill="#bf8700" font-size="12" font-weight="600" text-anchor="middle" class="f7">refuse · one LLM call</text><text x="685.0" y="398" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">sources still returned — a known limit</text><path d="M280 412 V425" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M276 425 L284 425 L280 432 Z" fill="#d1d9e0" class="f9"/><rect x="140" y="432" width="280" height="52" rx="7" fill="none" stroke="#1a7f37" stroke-width="1.5" class="s2"/><text x="280.0" y="453" fill="#1a7f37" font-size="12" font-weight="600" text-anchor="middle" class="f2">answer + sources</text><text x="280.0" y="470" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">arXiv ids cited inline, every one a joined row</text><text x="440" y="510" fill="#1f2328" font-size="11" font-weight="600" text-anchor="middle" class="f3">Refusing is control flow, not an instruction the model might ignore.</text></svg>