<svg xmlns="http://www.w3.org/2000/svg" width="840" height="424" viewBox="0 0 840 424" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>@media (prefers-color-scheme: dark){.f1{fill:#4493f8}.f2{fill:#3fb950}.f3{fill:#f0f6fc}.f4{fill:#9198a1}.f5{fill:#656c76}.f7{fill:#d29922}.f9{fill:#3d444d}.f12{fill:#21262d}.s1{stroke:#4493f8}.s2{stroke:#3fb950}.s7{stroke:#d29922}.s9{stroke:#3d444d}}</style><rect x="292" y="14" width="236" height="46" rx="7" fill="#eaeef2" stroke="#d1d9e0" stroke-width="1.5" class="f12 s9"/><text x="410" y="34" fill="#1f2328" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f3">eval/golden.jsonl</text><text x="410" y="50" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">121 rows · 97 positives + 24 must-refuse</text><path d="M410 60 V75" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M406 75 L414 75 L410 82 Z" fill="#d1d9e0" class="f9"/><rect x="235" y="82" width="350" height="56" rx="7" fill="none" stroke="#0969da" stroke-width="1.5" class="s1"/><text x="410" y="102" fill="#0969da" font-size="12" font-weight="600" text-anchor="middle" class="f1">Report 0 · coverage</text><text x="410" y="118" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">which labelled papers exist in this corpus?</text><text x="410" y="131" fill="#818b98" font-size="10" font-weight="400" text-anchor="middle" class="f5">missing → skipped and counted, never failures</text><rect x="24.0" y="162.0" width="380.0" height="248" rx="9" fill="#eaeef2" class="f12"/><rect x="430.0" y="162.0" width="380.0" height="248" rx="9" fill="#eaeef2" class="f12"/><text x="40" y="180" fill="#1a7f37" font-size="10" font-weight="700" text-anchor="start" class="f2">offline · free · seconds</text><text x="446" y="180" fill="#bf8700" font-size="10" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f7">--with-llm · ~85k tokens</text><path d="M410 138 V152 M214 152 H620 M214 152 V191 M620 152 V191" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M210 191 L218 191 L214 198 Z" fill="#d1d9e0" class="f9"/><path d="M616 191 L624 191 L620 198 Z" fill="#d1d9e0" class="f9"/><rect x="40" y="198" width="348" height="60" rx="7" fill="none" stroke="#0969da" stroke-width="1.5" class="s1"/><text x="214" y="218" fill="#0969da" font-size="12" font-weight="600" text-anchor="middle" class="f1">Probe · one retrieval per question</text><text x="214" y="234" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">embed → retrieve(k=20) → rank of the gold paper</text><text x="214" y="247" fill="#818b98" font-size="10" font-weight="400" text-anchor="middle" class="f5">121 probes — nothing below queries again</text><path d="M214 258 V272 M125 272 H303 M125 272 V289 M303 272 V289" stroke="#1a7f37" stroke-width="1.5" fill="none" class="s2"/><path d="M121 289 L129 289 L125 296 Z" fill="#1a7f37" class="f2"/><path d="M299 289 L307 289 L303 296 Z" fill="#1a7f37" class="f2"/><rect x="40" y="296" width="170" height="82" rx="7" fill="none" stroke="#1a7f37" stroke-width="1.5" class="s2"/><text x="125" y="316" fill="#1a7f37" font-size="12" font-weight="600" text-anchor="middle" class="f2">Report 1</text><text x="125" y="331" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">retrieval · 97 rows</text><text x="125" y="349" fill="#1f2328" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f3">recall@1 / @5 / @10</text><text x="125" y="364" fill="#1f2328" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f3">MRR@20</text><rect x="218" y="296" width="170" height="82" rx="7" fill="none" stroke="#1a7f37" stroke-width="1.5" class="s2"/><text x="303" y="316" fill="#1a7f37" font-size="12" font-weight="600" text-anchor="middle" class="f2">Report 2</text><text x="303" y="331" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">sweep · 97 + 24 rows</text><text x="303" y="349" fill="#1f2328" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f3">cost of each t</text><text x="303" y="364" fill="#1f2328" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f3">→ t = 0.75</text><rect x="446" y="198" width="348" height="180" rx="7" fill="none" stroke="#bf8700" stroke-width="1.5" class="s7"/><text x="620" y="222" fill="#bf8700" font-size="12" font-weight="600" text-anchor="middle" class="f7">Report 3 · end to end</text><text x="620" y="240" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">40 sampled positives + all 24 must-refuse</text><text x="620" y="255" fill="#818b98" font-size="10" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f5">calls the real answer_question()</text><line x1="476" y1="272" x2="764" y2="272" stroke="#d1d9e0" stroke-width="1" class="s9"/><text x="620" y="294" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">the one thing nothing else measures:</text><text x="620" y="316" fill="#1a7f37" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f2">0 / 24  answered anyway</text><text x="620" y="338" fill="#1a7f37" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f2">0 / 40  wrongly refused</text><text x="620" y="362" fill="#1f2328" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f3">37 / 40 cite the correct paper</text><text x="420" y="418" fill="#818b98" font-size="10" font-weight="400" text-anchor="middle" class="f5">Every query path the eval touches is the one that ships — retrieve, fit_context, answer_question.</text></svg>