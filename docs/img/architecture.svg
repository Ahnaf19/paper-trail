<svg xmlns="http://www.w3.org/2000/svg" width="860" height="486" viewBox="0 0 860 486" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>@media (prefers-color-scheme: dark){.f1{fill:#4493f8}.f2{fill:#3fb950}.f3{fill:#f0f6fc}.f4{fill:#9198a1}.f5{fill:#656c76}.f7{fill:#d29922}.f9{fill:#3d444d}.f12{fill:#21262d}.s1{stroke:#4493f8}.s2{stroke:#3fb950}.s4{stroke:#9198a1}.s6{stroke:#545d68}.s7{stroke:#d29922}.s9{stroke:#3d444d}}</style><rect x="16.0" y="16.0" width="828.0" height="156" rx="9" fill="#eaeef2" class="f12"/><text x="32" y="36" fill="#0969da" font-size="10" font-weight="700" text-anchor="start" class="f1">WRITE PATH</text><text x="108" y="36" fill="#818b98" font-size="10" font-weight="400" text-anchor="start" class="f5">paper ingest — the only thing that talks to arXiv</text><rect x="32" y="56" width="128" height="66" rx="7" fill="none" stroke="#afb8c1" stroke-width="1.5" stroke-dasharray="4 3" class="s6"/><text x="96" y="78" fill="#59636e" font-size="11" font-weight="600" text-anchor="middle" class="f4">arXiv Atom API</text><text x="96" y="94" fill="#818b98" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f5">1 request / 3 s</text><text x="96" y="108" fill="#818b98" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f5">backoff on 429</text><path d="M162 82 H182" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M182 78 L182 86 L188 82 Z" fill="#d1d9e0" class="f9"/><rect x="190" y="56" width="108" height="52" rx="7" fill="none" stroke="#0969da" stroke-width="1.5" class="s1"/><text x="244.0" y="78" fill="#0969da" font-size="12" font-weight="600" text-anchor="middle" class="f1">fetch</text><text x="244.0" y="94" fill="#818b98" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f5">ArxivClient</text><rect x="312" y="56" width="108" height="52" rx="7" fill="none" stroke="#0969da" stroke-width="1.5" class="s1"/><text x="366.0" y="78" fill="#0969da" font-size="12" font-weight="600" text-anchor="middle" class="f1">parse</text><text x="366.0" y="94" fill="#818b98" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f5">parse_feed</text><rect x="434" y="56" width="108" height="52" rx="7" fill="none" stroke="#0969da" stroke-width="1.5" class="s1"/><text x="488.0" y="78" fill="#0969da" font-size="12" font-weight="600" text-anchor="middle" class="f1">upsert</text><text x="488.0" y="94" fill="#818b98" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f5">upsert_papers</text><rect x="556" y="56" width="108" height="52" rx="7" fill="none" stroke="#0969da" stroke-width="1.5" class="s1"/><text x="610.0" y="78" fill="#0969da" font-size="12" font-weight="600" text-anchor="middle" class="f1">embed</text><text x="610.0" y="94" fill="#818b98" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f5">refresh_embeddings</text><path d="M299 82 H305" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M305 78 L305 86 L311 82 Z" fill="#d1d9e0" class="f9"/><path d="M421 82 H427" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M427 78 L427 86 L433 82 Z" fill="#d1d9e0" class="f9"/><path d="M543 82 H549" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M549 78 L549 86 L555 82 Z" fill="#d1d9e0" class="f9"/><path d="M434 118 V132 H664 V118" stroke="#1a7f37" stroke-width="1.5" fill="none" class="s2"/><text x="549" y="150" fill="#1a7f37" font-size="10" font-weight="600" text-anchor="middle" class="f2">one transaction per page — a paper cannot commit without its vector</text><path d="M665 82 H700" stroke="#d1d9e0" stroke-width="1.5" fill="none" stroke-dasharray="4 3" class="s9"/><path d="M700 78 L700 86 L706 82 Z" fill="#d1d9e0" class="f9"/><rect x="708" y="56" width="124" height="52" rx="7" fill="none" stroke="#59636e" stroke-width="1.5" class="s4"/><text x="770.0" y="78" fill="#59636e" font-size="12" font-weight="600" text-anchor="middle" class="f4">watermark</text><text x="770.0" y="94" fill="#818b98" font-size="9" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f5">_advance_watermark</text><text x="770" y="150" fill="#818b98" font-size="9" font-weight="400" text-anchor="middle" class="f5">after the loop, only if it</text><text x="770" y="162" fill="#818b98" font-size="9" font-weight="400" text-anchor="middle" class="f5">reached the previous mark</text><path d="M430 172 V193" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M426 193 L434 193 L430 200 Z" fill="#d1d9e0" class="f9"/><rect x="272" y="200" width="316" height="56" rx="7" fill="#eaeef2" stroke="#1a7f37" stroke-width="1.5" class="f12 s2"/><text x="430" y="222" fill="#1a7f37" font-size="12" font-weight="700" text-anchor="middle" class="f2">PostgreSQL + pgvector</text><text x="430" y="240" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">papers · authors · categories · 384-dim vectors</text><path d="M430 256 V276 M228 276 H632 M228 276 V299 M632 276 V299" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M224 299 L232 299 L228 306 Z" fill="#d1d9e0" class="f9"/><path d="M628 299 L636 299 L632 306 Z" fill="#d1d9e0" class="f9"/><rect x="16.0" y="306.0" width="412.0" height="144" rx="9" fill="#eaeef2" class="f12"/><text x="32" y="326" fill="#1a7f37" font-size="10" font-weight="700" text-anchor="start" class="f2">READ</text><text x="70" y="326" fill="#818b98" font-size="10" font-weight="400" text-anchor="start" class="f5">aggregates</text><rect x="32" y="336" width="380" height="52" rx="7" fill="none" stroke="#1a7f37" stroke-width="1.5" class="s2"/><text x="222" y="358" fill="#1a7f37" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f2">GET /stats/*</text><text x="222" y="375" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">three GROUP BY queries, computed by Postgres</text><text x="222" y="410" fill="#818b98" font-size="10" font-weight="400" text-anchor="middle" class="f5">no network at all — answers with arXiv unreachable</text><rect x="432.0" y="306.0" width="412.0" height="144" rx="9" fill="#eaeef2" class="f12"/><text x="448" y="326" fill="#bf8700" font-size="10" font-weight="700" text-anchor="start" class="f7">READ</text><text x="486" y="326" fill="#818b98" font-size="10" font-weight="400" text-anchor="start" class="f5">answers</text><rect x="448" y="336" width="380" height="52" rx="7" fill="none" stroke="#bf8700" stroke-width="1.5" class="s7"/><text x="638" y="358" fill="#bf8700" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" class="f7">POST /ask</text><text x="638" y="375" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle" class="f4">embed ▸ top-k ▸ gate ▸ generate</text><path d="M638 388 V395" stroke="#d1d9e0" stroke-width="1.5" fill="none" class="s9"/><path d="M634 395 L642 395 L638 402 Z" fill="#d1d9e0" class="f9"/><rect x="520" y="402" width="236" height="34" rx="7" fill="none" stroke="#afb8c1" stroke-width="1.5" stroke-dasharray="4 3" class="s6"/><text x="638" y="423" fill="#59636e" font-size="10" font-weight="600" text-anchor="middle" class="f4">OpenAI-compatible LLM</text><text x="430" y="472" fill="#1f2328" font-size="11" font-weight="600" text-anchor="middle" class="f3">The read paths never contact arXiv. The write path never talks to the LLM.</text></svg>