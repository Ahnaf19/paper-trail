<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="140" y="16" width="280" height="36" rx="7" fill="#eaeef2" stroke="#59636e" stroke-width="1.5"/><text x="280.0" y="38.0" fill="#59636e" font-size="12" font-weight="600" text-anchor="middle">question</text><path d="M280 52 V65" stroke="#d1d9e0" stroke-width="1.5" fill="none"/><path d="M276 65 L284 65 L280 72 Z" fill="#d1d9e0"/><rect x="140" y="72" width="280" height="52" rx="7" fill="none" stroke="#0969da" stroke-width="1.5"/><text x="280.0" y="93" fill="#0969da" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">embed_query</text><text x="280.0" y="110" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle">bge-small · pushed to a thread, CPU-bound</text><path d="M280 124 V137" stroke="#d1d9e0" stroke-width="1.5" fill="none"/><path d="M276 137 L284 137 L280 144 Z" fill="#d1d9e0"/><rect x="140" y="144" width="280" height="52" rx="7" fill="none" stroke="#0969da" stroke-width="1.5"/><text x="280.0" y="165" fill="#0969da" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">retrieve top-k</text><text x="280.0" y="182" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle">one SQL join — a source cannot fail to resolve</text><path d="M280 196 V209" stroke="#d1d9e0" stroke-width="1.5" fill="none"/><path d="M276 209 L284 209 L280 216 Z" fill="#d1d9e0"/><rect x="140" y="216" width="280" height="52" rx="7" fill="none" stroke="#bf8700" stroke-width="1.5"/><text x="280.0" y="237" fill="#bf8700" font-size="12" font-weight="600" text-anchor="middle">GATE 1  ·  score ≥ t</text><text x="280.0" y="254" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle">deterministic · runs before the model</text><path d="M420 242 H513" stroke="#bf8700" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/><path d="M513 238 L513 246 L520 242 Z" fill="#bf8700"/><text x="470" y="234" fill="#bf8700" font-size="9" font-weight="600" text-anchor="middle">below t</text><rect x="520" y="216" width="330" height="52" rx="7" fill="none" stroke="#bf8700" stroke-width="1.5" stroke-dasharray="4 3"/><text x="685.0" y="237" fill="#bf8700" font-size="12" font-weight="600" text-anchor="middle">refuse · zero tokens</text><text x="685.0" y="254" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle">the LLM is never called · sources: []</text><path d="M280 268 V281" stroke="#d1d9e0" stroke-width="1.5" fill="none"/><path d="M276 281 L284 281 L280 288 Z" fill="#d1d9e0"/><rect x="140" y="288" width="280" height="52" rx="7" fill="none" stroke="#0969da" stroke-width="1.5"/><text x="280.0" y="309" fill="#0969da" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">fit_context</text><text x="280.0" y="326" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle">only the papers that fit the budget are cited</text><path d="M280 340 V353" stroke="#d1d9e0" stroke-width="1.5" fill="none"/><path d="M276 353 L284 353 L280 360 Z" fill="#d1d9e0"/><rect x="140" y="360" width="280" height="52" rx="7" fill="none" stroke="#bf8700" stroke-width="1.5"/><text x="280.0" y="381" fill="#bf8700" font-size="12" font-weight="600" text-anchor="middle">GATE 2  ·  the grounded prompt</text><text x="280.0" y="398" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle">probabilistic · one LLM call</text><path d="M420 386 H513" stroke="#bf8700" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/><path d="M513 382 L513 390 L520 386 Z" fill="#bf8700"/><text x="470" y="378" fill="#bf8700" font-size="9" font-weight="600" text-anchor="middle">not in them</text><rect x="520" y="360" width="330" height="52" rx="7" fill="none" stroke="#bf8700" stroke-width="1.5" stroke-dasharray="4 3"/><text x="685.0" y="381" fill="#bf8700" font-size="12" font-weight="600" text-anchor="middle">refuse · one LLM call</text><text x="685.0" y="398" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle">sources still returned — a known limit</text><path d="M280 412 V425" stroke="#d1d9e0" stroke-width="1.5" fill="none"/><path d="M276 425 L284 425 L280 432 Z" fill="#d1d9e0"/><rect x="140" y="432" width="280" height="52" rx="7" fill="none" stroke="#1a7f37" stroke-width="1.5"/><text x="280.0" y="453" fill="#1a7f37" font-size="12" font-weight="600" text-anchor="middle">answer + sources</text><text x="280.0" y="470" fill="#59636e" font-size="10" font-weight="400" text-anchor="middle">arXiv ids cited inline, every one a joined row</text><text x="440" y="510" fill="#1f2328" font-size="11" font-weight="600" text-anchor="middle">Refusing is control flow, not an instruction the model might ignore.</text></svg>